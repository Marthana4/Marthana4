name: generate pastel snake 🐍

on:
  schedule:
    - cron: "0 0 * * *"   # update tiap hari
  workflow_dispatch:       # bisa dijalankan manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-pastel.svg?color_snake=#FF8FAB&color_dots=#FFF0F5,#FBC2EB,#E0C3FC,#C9A0DC,#FF6F91

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
